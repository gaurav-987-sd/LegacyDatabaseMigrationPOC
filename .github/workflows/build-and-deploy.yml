name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "argocd/**"
      - "*.md"

permissions:
  contents: write

jobs:
  build-and-push:
    # Uses ACR Tasks (az acr build) instead of a local Docker engine, so this
    # can run on a plain self-hosted Windows runner with no Docker install
    # required on the runner itself.
    runs-on: [self-hosted, windows]
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compute image tag
        id: tag
        shell: bash
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # CHANGE-ME: set ACR_NAME as a repo variable (Settings > Secrets and
      # variables > Actions > Variables) once you have it from
      # `terraform output acr_name`.
      - name: Build and push Windows image via ACR Tasks
        shell: bash
        run: |
          az acr build \
            --registry ${{ vars.ACR_NAME }} \
            --platform windows \
            --image legacydbmig-app:${{ steps.tag.outputs.tag }} \
            --image legacydbmig-app:latest \
            .

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set new image tag in kustomization.yaml
        run: |
          cd k8s/base
          sed -i "s|newTag: .*|newTag: ${{ needs.build-and-push.outputs.image_tag }}|" kustomization.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          git commit -m "deploy: legacydbmig-app:${{ needs.build-and-push.outputs.image_tag }}" || echo "no changes to commit"
          git push
