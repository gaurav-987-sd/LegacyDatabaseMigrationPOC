name: Build and Deploy

# Push to main touching app source -> build image, push to ACR, update the
# image tag in k8s/base/kustomization.yaml, commit it back to main.
# ArgoCD (already watching k8s/base/) picks up that commit and syncs
# automatically -- this workflow never touches the cluster directly.
on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "argocd/**"
      - "*.md"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

env:
  IMAGE_NAME: legacydbmig-app
  ACR_NAME: acrlegacydbmigdevzj4r47

jobs:
  build-and-push:
    name: Build & push image
    # Windows container image, requires a Windows Docker host to build.
    # windows-latest GitHub-hosted runner has this -- no self-hosted runner
    # needed.
    runs-on: windows-latest
    environment: dev
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
      - uses: actions/checkout@v4

      - name: Narrow diagnostic
        shell: pwsh
        run: |
          Write-Host "PATH:"; $env:PATH
          Get-Command docker -ErrorAction SilentlyContinue
          Get-Service *docker* -ErrorAction SilentlyContinue

      # If diagnostic shows Docker missing, add install step here
      - name: Install Docker via Chocolatey
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install docker-desktop -y --no-progress
          docker version

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compute image tag
        id: tag
        shell: bash
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Docker build (Windows container)
        run: |
          docker build `
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} `
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest `
            .

      - name: Docker push
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

  update-manifest:
    name: Update image tag for ArgoCD (${{ needs.build-and-push.outputs.image_tag }})
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set new image tag in kustomization.yaml
        run: |
          cd k8s/base
          sed -i "s|newTag: .*|newTag: ${{ needs.build-and-push.outputs.image_tag }}|" kustomization.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          git commit -m "deploy: ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}" || echo "no changes to commit"
          git push