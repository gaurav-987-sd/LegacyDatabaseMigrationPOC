# Requires the "Secrets Store CSI Driver" + "Azure Key Vault provider" AKS
# add-on to be enabled on the cluster. Enable it with:
#   az aks enable-addons --addons azure-keyvault-secrets-provider \
#     --resource-group <rg> --name <cluster-name>
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: legacydbmig-kv
  namespace: legacydbmig
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # CHANGE: terraform output workload_identity_client_id (same value as serviceaccount.yaml)
    clientID: "607c22a5-19a9-497b-bc4e-59b537e0e403"
    # CHANGE: terraform output key_vault_name
    keyvaultName: "kv-legacydbmig-de-zj4r47"
    # CHANGE: your Azure AD tenant ID
    tenantId: "2c7a687d-17ff-4888-92b4-39c9fd42883d"
    objects: |
      array:
        - |
          objectName: SqlConnectionString
          objectType: secret
        - |
          objectName: PostgresConnectionString
          objectType: secret
  # Projects the Key Vault secrets into a real Kubernetes Secret too, so the
  # app can read them as plain environment variables instead of files.
  secretObjects:
    - secretName: legacydbmig-db-secrets
      type: Opaque
      data:
        - objectName: SqlConnectionString
          key: AppDbConnection
        - objectName: PostgresConnectionString
          key: PostgresConnection
